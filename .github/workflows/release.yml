name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create datever release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE="v$(date -u +'%Y.%m.%d')"
          VERSION="$BASE"
          COUNT=0
          while gh release view "$VERSION" &>/dev/null; do
            COUNT=$((COUNT + 1))
            VERSION="$BASE.$COUNT"
          done
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --target main
